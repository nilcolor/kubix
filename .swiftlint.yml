# Keep build outputs and third-party sources out of linting.
excluded:
  - build
  - .build
  - KubixCore/.build
  - GhosttyKit.xcframework
  - kubix/Resources

# Deliberate style conventions, with no legacy size allowances.
disabled_rules:
  - identifier_name
  - trailing_comma
  - force_try
  - optional_data_string_conversion

line_length:
  warning: 200
  error: 400
  ignores_comments: true
  ignores_urls: true

nesting:
  type_level: 2

large_tuple:
  warning: 3
  error: 5
