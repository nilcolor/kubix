apiVersion: v1
kind: Config
current-context: ignored
clusters:
  - name: shared
    cluster:
      server: https://ignored.invalid
      certificate-authority-data: aWdub3JlZA==
      proxy-url: http://ignored-proxy.invalid
  - name: second
    cluster:
      server: https://second.invalid
      certificate-authority: ../pki/second-ca.pem
contexts:
  - name: shared
    context:
      cluster: second
      user: second
      namespace: ignored
  - name: mixed
    context:
      cluster: shared
      user: second
users:
  - name: shared
    user:
      token: ignored-token
      exec:
        command: ~ignored-user/ignored-plugin
  - name: second
    user:
      tokenFile: ./tokens/second
      client-certificate: certs/second.pem
      client-key: ../keys/second.pem
      exec:
        apiVersion: client.authentication.k8s.io/v1beta1
        command: ../plugins/test-auth
