apiVersion: v1
kind: Config
current-context: exec
clusters:
  - name: local
    cluster:
      server: https://cluster.invalid
      certificate-authority: ~/certificates/ca.pem
      insecure-skip-tls-verify: true
contexts:
  - name: exec
    context:
      cluster: local
      user: plugin
  - name: certificate
    context:
      cluster: local
      user: certificate
users:
  - name: plugin
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1
        command: ./plugins/test-auth
        args: [get-token, "--profile", "synthetic profile", "$(not-a-shell-command)"]
        env:
          - name: SYNTHETIC_SECRET
            value: synthetic-env-not-a-credential
          - name: PATH
            value: /synthetic/tools
        interactiveMode: Never
        installHint: Install the synthetic test plugin.
        provideClusterInfo: true
  - name: certificate
    user:
      client-certificate: certs/client.pem
      client-certificate-data: c3ludGhldGljLWNlcnQ=
      client-key: ~/keys/client.pem
      client-key-data: c3ludGhldGljLWtleQ==
