apiVersion: v1
kind: Config
current-context: shared
clusters:
  - name: shared
    cluster:
      server: https://first.invalid
      certificate-authority: first-ca.pem
contexts:
  - name: shared
    context:
      cluster: shared
      user: shared
  - name: cross-file
    context:
      cluster: second
      user: second
      namespace: other
users:
  - name: shared
    user:
      tokenFile: first-token
