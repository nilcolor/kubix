apiVersion: v1
kind: Config
current-context: development
clusters:
  - name: local
    cluster:
      server: https://cluster.invalid:6443
      certificate-authority: pki/ca.pem
      certificate-authority-data: c3ludGhldGljLWNh
      insecure-skip-tls-verify: false
      proxy-url: ""
      tls-server-name: cluster.invalid
      disable-compression: true
contexts:
  - name: development
    context:
      cluster: local
      user: developer
      namespace: sandbox
users:
  - name: developer
    user:
      token: synthetic-token-not-a-credential
      tokenFile: tokens/current
